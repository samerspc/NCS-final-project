name: Container scan (config -> image)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  config_scan:
    name: Config scan (Dockerfile + Compose)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose files
        run: |
          set -euo pipefail

          for f in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
            if [ -f "$f" ]; then
              echo "Validating $f"
              docker compose -f "$f" config >/dev/null
            fi
          done

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov

      - name: Checkov scan Dockerfile (blocking)
        run: |
          checkov -d . --framework dockerfile

  image_scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    needs: config_scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t myapp:${{ github.sha }} -f Dockerfile .

      - name: Trivy image scan (blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: myapp:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
