name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Run Black (code formatting check)
      run: |
        black --check --diff .
    
    - name: Run isort (import sorting check)
      run: |
        isort --check-only --diff .
    
    - name: Run Flake8 (linting)
      run: |
        flake8 .
    
    - name: Run Pylint
      run: |
        pylint insecure/security/ insecure/insecure/ --load-plugins=pylint_django || true
    
    - name: Run MyPy (type checking)
      run: |
        mypy insecure/ --ignore-missing-imports || true
    
    - name: Run Bandit (security linting)
      run: |
        bandit -r insecure/security -f json -o bandit-report.json || true
        bandit -r insecure/security

