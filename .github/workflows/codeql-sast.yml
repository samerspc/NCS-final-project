name: SAST - CodeQL Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Запуск каждый день в 2:00 UTC для поиска новых уязвимостей
    - cron: '0 2 * * *'
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Полная история для более точного анализа
        fetch-depth: 0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Используем стандартные security queries + кастомный config
        queries: +security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:python"
        # Загружаем результаты в Security tab
        upload: true
        # Создаем SARIF файл для интеграции
        output: codeql-results.sarif
      continue-on-error: true

    - name: Upload CodeQL results as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: codeql-results
        path: codeql-results.sarif
        retention-days: 30

    - name: Generate SARIF summary
      if: always()
      run: |
        echo "## 📊 CodeQL Analysis Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Ищем SARIF файл
        SARIF_FILE="codeql-results.sarif"
        
        if [ -f "$SARIF_FILE" ]; then
          echo "📄 Парсинг SARIF файла..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Парсим SARIF и извлекаем статистику
          python3 << 'PYEOF'
          import json
          import sys
          import os
          from pathlib import Path
          
          sarif_file = os.environ.get('SARIF_FILE', 'codeql-results.sarif')
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          
          if not summary_file:
              summary_file = '/dev/stdout'
          
          try:
              # Проверяем существование файла
              if not os.path.exists(sarif_file):
                  with open(summary_file, 'a') as out:
                      out.write(f"⚠️  SARIF файл не найден: {sarif_file}\n\n")
                      out.write("💡 CodeQL может потребоваться несколько запусков для создания базы данных.\n")
                  sys.exit(0)
              
              with open(sarif_file, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              runs = data.get('runs', [])
              if not runs:
                  with open(summary_file, 'a') as out:
                      out.write("⚠️  SARIF файл пуст или не содержит результатов\n\n")
                  sys.exit(0)
              
              total_results = 0
              results_by_level = {}
              results_by_rule = {}
              results_by_file = {}
              
              for run in runs:
                  tool = run.get('tool', {}).get('driver', {})
                  tool_name = tool.get('name', 'Unknown')
                  tool_version = tool.get('version', '')
                  
                  results = run.get('results', [])
                  
                  for result in results:
                      total_results += 1
                      level = result.get('level', 'unknown')
                      rule_id = result.get('ruleId', 'unknown')
                      
                      results_by_level[level] = results_by_level.get(level, 0) + 1
                      results_by_rule[rule_id] = results_by_rule.get(rule_id, 0) + 1
                      
                      # Собираем информацию о файлах
                      locations = result.get('locations', [])
                      if locations:
                          file_uri = locations[0].get('physicalLocation', {}).get('artifactLocation', {}).get('uri', 'unknown')
                          results_by_file[file_uri] = results_by_file.get(file_uri, 0) + 1
              
              # Выводим в summary
              with open(summary_file, 'a') as f:
                  if total_results == 0:
                      f.write("✅ **Нет проблем найдено!**\n\n")
                  else:
                      f.write(f"**Всего найдено проблем**: {total_results}\n\n")
                      
                      if results_by_level:
                          f.write("### По уровню серьезности:\n\n")
                          level_emoji = {'error': '🔴', 'warning': '🟡', 'note': '🔵', 'none': '⚪'}
                          for level in ['error', 'warning', 'note', 'none']:
                              if level in results_by_level:
                                  emoji = level_emoji.get(level, '⚪')
                                  f.write(f"- {emoji} **{level.upper()}**: {results_by_level[level]}\n")
                          f.write("\n")
                      
                      if results_by_rule:
                          f.write("### Топ-10 типов проблем:\n\n")
                          sorted_rules = sorted(results_by_rule.items(), key=lambda x: x[1], reverse=True)[:10]
                          for rule_id, count in sorted_rules:
                              f.write(f"- `{rule_id}`: {count}\n")
                          f.write("\n")
                      
                      if results_by_file:
                          f.write("### Файлы с проблемами:\n\n")
                          sorted_files = sorted(results_by_file.items(), key=lambda x: x[1], reverse=True)[:5]
                          for file_uri, count in sorted_files:
                              f.write(f"- `{file_uri}`: {count} проблем\n")
                          f.write("\n")
                  
                  f.write("### 📁 Артефакты:\n\n")
                  f.write("- SARIF файл доступен в артефактах workflow\n")
                  f.write("- Результаты также в GitHub Security Tab\n\n")
                  
                  f.write("### 🔍 Как посмотреть детали:\n\n")
                  f.write("1. **GitHub Security Tab** - автоматически обрабатывается GitHub\n")
                  f.write("2. **Скачайте артефакт** и используйте:\n")
                  f.write("   - VS Code: установите расширение 'SARIF Viewer'\n")
                  f.write("   - Онлайн: https://microsoft.github.io/sarif-web-component/\n")
                  f.write("   - Скрипт: `python scripts/view_sarif.py codeql-results.sarif`\n")
          
          except FileNotFoundError:
              with open(summary_file, 'a') as out:
                  out.write(f"⚠️  SARIF файл не найден: {sarif_file}\n\n")
          except json.JSONDecodeError as e:
              with open(summary_file, 'a') as out:
                  out.write(f"⚠️  Ошибка парсинга SARIF: {e}\n\n")
          except Exception as e:
              with open(summary_file, 'a') as out:
                  out.write(f"⚠️  Ошибка: {type(e).__name__}: {e}\n\n")
          PYEOF
        else
          echo "⚠️  SARIF файл не найден: $SARIF_FILE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Примечание**: CodeQL может потребоваться несколько запусков для создания базы данных кода." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Результаты будут доступны в GitHub Security Tab после успешного анализа." >> $GITHUB_STEP_SUMMARY
        fi

  bandit-sast:
    name: Bandit Security Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml]

    - name: Run Bandit SAST scan
      run: |
        bandit -r insecure/ -f json -o bandit-report.json || true
        bandit -r insecure/ -f txt -o bandit-report.txt || true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: |
          bandit-report.json
          bandit-report.txt
        retention-days: 30

    - name: Comment PR with Bandit results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const report = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
            const issues = report.results || [];
            
            if (issues.length === 0) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ **Bandit SAST Scan**: No security issues found!'
              });
            } else {
              const highSeverity = issues.filter(i => i.issue_severity === 'HIGH' || i.issue_severity === 'MEDIUM');
              const criticalCount = issues.filter(i => i.issue_severity === 'HIGH').length;
              
              let comment = `## 🔒 Bandit SAST Scan Results\n\n`;
              comment += `**Total issues found**: ${issues.length}\n`;
              comment += `**High severity**: ${criticalCount}\n`;
              comment += `**Medium severity**: ${highSeverity.length - criticalCount}\n\n`;
              
              if (criticalCount > 0) {
                comment += `⚠️ **Warning**: ${criticalCount} high severity issues found!\n\n`;
              }
              
              comment += `### Top Issues:\n\n`;
              issues.slice(0, 10).forEach(issue => {
                const emoji = issue.issue_severity === 'HIGH' ? '🔴' : '🟡';
                comment += `${emoji} **${issue.issue_severity}**: ${issue.issue_text}\n`;
                comment += `   - File: \`${issue.filename}:${issue.line_number}\`\n`;
                comment += `   - Test ID: \`${issue.test_id}\`\n\n`;
              });
              
              comment += `\n<details>\n<summary>View full report</summary>\n\n`;
              comment += `See artifacts for complete JSON and TXT reports.\n`;
              comment += `</details>`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          } catch (error) {
            console.log('Could not parse Bandit report:', error);
          }

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [codeql-analysis, bandit-sast]
    if: always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: security-reports

    - name: Create security summary
      run: |
        echo "# Security Scan Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "## CodeQL Analysis" >> security-summary.md
        echo "- Results uploaded to GitHub Security tab" >> security-summary.md
        echo "- SARIF file available in artifacts" >> security-summary.md
        echo "" >> security-summary.md
        echo "## Bandit SAST Scan" >> security-summary.md
        if [ -f security-reports/bandit-report/bandit-report.txt ]; then
          echo "### Issues Found:" >> security-summary.md
          cat security-reports/bandit-report/bandit-report.txt >> security-summary.md
        else
          echo "No Bandit report found" >> security-summary.md
        fi

    - name: Upload security summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary
        path: security-summary.md
        retention-days: 30

