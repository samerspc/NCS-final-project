name: SAST - CodeQL Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Запуск каждый день в 2:00 UTC для поиска новых уязвимостей
    - cron: '0 2 * * *'
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Полная история для более точного анализа
        fetch-depth: 0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Используем стандартные security queries + кастомный config
        queries: +security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:python"
        # Загружаем результаты в Security tab
        upload: true
        # Создаем SARIF файл для интеграции
        output: codeql-results.sarif

    - name: Upload CodeQL results as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: codeql-results
        path: codeql-results.sarif
        retention-days: 30

  bandit-sast:
    name: Bandit Security Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml]

    - name: Run Bandit SAST scan
      run: |
        bandit -r insecure/ -f json -o bandit-report.json || true
        bandit -r insecure/ -f txt -o bandit-report.txt || true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: |
          bandit-report.json
          bandit-report.txt
        retention-days: 30

    - name: Comment PR with Bandit results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const report = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
            const issues = report.results || [];
            
            if (issues.length === 0) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ **Bandit SAST Scan**: No security issues found!'
              });
            } else {
              const highSeverity = issues.filter(i => i.issue_severity === 'HIGH' || i.issue_severity === 'MEDIUM');
              const criticalCount = issues.filter(i => i.issue_severity === 'HIGH').length;
              
              let comment = `## 🔒 Bandit SAST Scan Results\n\n`;
              comment += `**Total issues found**: ${issues.length}\n`;
              comment += `**High severity**: ${criticalCount}\n`;
              comment += `**Medium severity**: ${highSeverity.length - criticalCount}\n\n`;
              
              if (criticalCount > 0) {
                comment += `⚠️ **Warning**: ${criticalCount} high severity issues found!\n\n`;
              }
              
              comment += `### Top Issues:\n\n`;
              issues.slice(0, 10).forEach(issue => {
                const emoji = issue.issue_severity === 'HIGH' ? '🔴' : '🟡';
                comment += `${emoji} **${issue.issue_severity}**: ${issue.issue_text}\n`;
                comment += `   - File: \`${issue.filename}:${issue.line_number}\`\n`;
                comment += `   - Test ID: \`${issue.test_id}\`\n\n`;
              });
              
              comment += `\n<details>\n<summary>View full report</summary>\n\n`;
              comment += `See artifacts for complete JSON and TXT reports.\n`;
              comment += `</details>`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          } catch (error) {
            console.log('Could not parse Bandit report:', error);
          }

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [codeql-analysis, bandit-sast]
    if: always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: security-reports

    - name: Create security summary
      run: |
        echo "# Security Scan Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "## CodeQL Analysis" >> security-summary.md
        echo "- Results uploaded to GitHub Security tab" >> security-summary.md
        echo "- SARIF file available in artifacts" >> security-summary.md
        echo "" >> security-summary.md
        echo "## Bandit SAST Scan" >> security-summary.md
        if [ -f security-reports/bandit-report/bandit-report.txt ]; then
          echo "### Issues Found:" >> security-summary.md
          cat security-reports/bandit-report/bandit-report.txt >> security-summary.md
        else
          echo "No Bandit report found" >> security-summary.md
        fi

    - name: Upload security summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary
        path: security-summary.md
        retention-days: 30

